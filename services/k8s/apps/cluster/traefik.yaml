apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 34.0.0
    helm:
      values: |
        deployment:
          kind: DaemonSet
        providers:
          kubernetesGateway:
            enabled: true
        gateway:
          enabled: false
        ports:
          web:
            hostPort: 80
            exposedPort: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
