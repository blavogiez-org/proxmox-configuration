apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-admin
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: alloy
            namespace: alloy-system
            repoURL: https://grafana.github.io/helm-charts
            chart: alloy
            targetRevision: 1.11.1
          - name: longhorn
            namespace: longhorn-system
            repoURL: https://charts.longhorn.io
            chart: longhorn
            targetRevision: 1.12.1
          - name: metrics-server
            namespace: kube-system
            repoURL: https://kubernetes-sigs.github.io/metrics-server/
            chart: metrics-server
            targetRevision: 3.12.2
          - name: traefik
            namespace: traefik
            repoURL: https://traefik.github.io/charts
            chart: traefik
            targetRevision: 34.0.0
          # exposition des ui admin par domaine privé par ex : argocd.priv.blavogiez.fr (pour éviter de par exemple "kubectl port-forward svc/argocd-server --address 0.0.0.0 -n argocd 8080:443")
          - name: priv-httproute-argocd
            namespace: argocd
            repoURL: https://bjw-s-labs.github.io/helm-charts
            chart: app-template
            targetRevision: 3.7.2
          - name: priv-httproute-longhorn
            namespace: longhorn-system
            repoURL: https://bjw-s-labs.github.io/helm-charts
            chart: app-template
            targetRevision: 3.7.2
  template:
    metadata:
      name: '{{ .name }}'
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: '{{ .repoURL }}'
          chart: '{{ .chart }}'
          targetRevision: '{{ .targetRevision }}'
          helm:
            valueFiles:
              - $gitRepo/services/k8s/apps/cluster/{{ .name }}/values.yaml
        - repoURL: https://github.com/blavogiez-org/proxmox-configuration.git
          targetRevision: 11-passage-de-services-en-argocd
          ref: gitRepo
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
