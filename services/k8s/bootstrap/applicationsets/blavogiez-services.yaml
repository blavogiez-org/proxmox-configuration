apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: blavogiez-services
  namespace: argocd
spec:
  goTemplate: true 
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - subPath: test-poc
  template: 
    metadata: 
      name: '{{ .subPath }}-service'
    spec:
      project: default
      source:
        repoURL: https://github.com/blavogiez-org/proxmox-configuration.git
        targetRevision: 11-passage-de-services-en-argocd
        path: services/k8s/apps/{{ .subPath }}
      destination:
        server: https://kubernetes.default.svc
        namespace: blavogiez
      syncPolicy:
        automated:
          prune: true
          selfHeal: true 
        syncOptions:
          - CreateNamespace=true
