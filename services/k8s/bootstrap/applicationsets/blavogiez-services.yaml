apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: blavogiez-services-helm
  namespace: argocd
spec:
  goTemplate: true 
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: vaultwarden
            repoURL: https://bjw-s-labs.github.io/helm-charts
            chart: app-template
            targetRevision: 3.7.2
          - name: openlatex
            repoURL: ghcr.io/openlatex
            chart: openlatex-compile
            targetRevision: 0.2.0
  template: 
    metadata: 
      name: '{{ .name }}'
      namespace: argocd
    spec:
      project: default
      sources:
        # cf https://argo-cd.readthedocs.io/en/latest/user-guide/multiple_sources/
        # En gros la source git nous donne les valeurs helm, et on les utilise pour les itérations / appels du helm chart 
        - repoURL: '{{ .repoURL }}'
          chart: '{{ .chart }}' 
          targetRevision: '{{ .targetRevision }}'
          helm:
            valueFiles:
              - $gitRepo/services/k8s/apps/{{ .name }}/values.yaml

        - repoURL: https://github.com/blavogiez-org/proxmox-configuration.git
          targetRevision: 11-passage-de-services-en-argocd
          ref: gitRepo
      destination:
        server: https://kubernetes.default.svc
        namespace: blavogiez-services-helm
      syncPolicy:
        automated:
          prune: true
          selfHeal: true 
        syncOptions:
          - CreateNamespace=true
