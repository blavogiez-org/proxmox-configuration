apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-blavogiez
  namespace: argocd
spec:
  goTemplate: true 
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: vaultwarden
            repoURL: https://bjw-s-labs.github.io/helm-charts
            chart: app-template
            targetRevision: 3.7.2
          - name: openlatex
            repoURL: ghcr.io/openlatex
            chart: openlatex-compile
            targetRevision: 0.2.0
          # cf https://github.com/blavogiez/ecodrop-api-rest-Semestre4
          - name: ecodrop
            repoURL: https://bjw-s-labs.github.io/helm-charts
            chart: app-template
            targetRevision: 3.7.2
  template: 
    metadata: 
      name: '{{ .name }}'
      namespace: argocd
    spec: 
      project: default
      sources:
        - repoURL: '{{ .repoURL }}'
          chart: '{{ .chart }}' 
          targetRevision: '{{ .targetRevision }}'
          helm:
            # values spécifiques + network policies injectées par défaut pour n'importe quel app avec argo (app qui a donc son propre namespace, et ça évite d'avoir un seul namespace avec uniquement ces network polciies)
            valueFiles:
              - $gitRepo/services/k8s/apps/cluster/default-network-policies/values.yaml
              - $gitRepo/services/k8s/apps/{{ .name }}/values.yaml
        - repoURL: https://github.com/blavogiez-org/proxmox-configuration.git
          targetRevision: perso
          ref: gitRepo
        - repoURL: https://github.com/blavogiez-org/proxmox-configuration.git
          targetRevision: perso
          path: services/k8s/apps/{{ .name }}/manifests
      destination:
        server: https://kubernetes.default.svc
        namespace: 'blavogiez-{{ .name }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true 
        syncOptions:
          - CreateNamespace=true
